[package]
name = "task-ai-platform"
version = "0.1.36"
edition = "2024"
description = "Local-first AI project room and handoff manager"
license = "Apache-2.0"
repository = "https://github.com/homaung/task-ai-platform"

[[bin]]
name = "task-ai-platform"
path = "src/main.rs"

[package.metadata.task-ai-platform]
upstream = "https://github.com/BloopAI/vibe-kanban"
upstream-version = "0.1.36"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"

server = { path = "../server" }
services = { path = "../services" }
utils = { path = "../utils" }
async-trait = { workspace = true }
tokio = { workspace = true }

tokio-util = { version = "0.7", features = ["io"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["registry"] }
serde_json = { workspace = true }
uuid = { version = "1.0", features = ["v4", "serde"] }
rustls = { workspace = true }
arboard = "3.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-web-kit = { version = "0.3", features = ["WKWebView"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
